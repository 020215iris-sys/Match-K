  <path class="edge" d="M691,150 L691,174" marker-end="url(#arw)"/>
  <path class="edge" d="M770,196 C790,190 795,170 800,158" marker-end="url(#arw)"/>

  <line x1="30" y1="332" x2="870" y2="332" stroke="#E5E7EB" stroke-width="1"/>

