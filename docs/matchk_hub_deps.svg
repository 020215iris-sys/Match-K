  <text x="30" y="662" class="el">★ 금색 = 공용 허브 (여러 곳이 의존 → 팀 규칙상 단독 PR로 먼저 머지)</text>
  <text x="30" y="680" class="el">화살표 방향 = "A가 B에 의존". 서로 다른 파일·함수를 만지는 작업은 병렬해도 충돌 없음.</text>
</svg>
