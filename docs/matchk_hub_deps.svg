<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#8A97A5"/>
    </marker>
    <style>
      .box{rx:10;ry:10;stroke-width:1.6;}
      .blue{fill:#EAF1F8;stroke:#185FA5;}
