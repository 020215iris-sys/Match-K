      .t{fill:#1A1A1A;font-size:13px;font-weight:600;}
      .ts{fill:#4B5563;font-size:11px;font-weight:400;}
      .sec{fill:#185FA5;font-size:13px;font-weight:800;letter-spacing:.04em;}
      .edge{stroke:#8A97A5;stroke-width:1.4;fill:none;}
      .el{fill:#6B7280;font-size:10.5px;}
      .center{text-anchor:middle;}
